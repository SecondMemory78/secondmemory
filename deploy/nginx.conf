# «Вторая память» — раскладка сайта на сервере.
#
#   /          сайт-витрина (landing)
#   /app/      приложение врача (собранный фронт)
#   /api/      бэкенд (uvicorn на 127.0.0.1:8000)
#   /admin/    админ-панель (закрыта по списку адресов)
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/secondmemory
#   sudo ln -s /etc/nginx/sites-available/secondmemory /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Домен: second-memory.ru. Меняется в двух местах ниже (server_name).
# Сертификат выпускает certbot: sudo certbot --nginx -d second-memory.ru -d www.second-memory.ru
# Он сам допишет строки ssl_certificate в этот файл.

# ── всё, что пришло по http, отправляем на https ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name second-memory.ru www.second-memory.ru;

    # certbot проверяет владение доменом по этому пути — не перенаправляем
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name second-memory.ru www.second-memory.ru;

    # строки ssl_certificate допишет certbot

    root /srv/secondmemory/landing;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;          # фото документов; в приложении лимит 15 МБ

    # сжатие
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── заголовки безопасности ───────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # HSTS включать ТОЛЬКО когда https уже работает и сертификат точно живой,
    # иначе браузер запомнит и обратно не пустит. Тогда же SECURE_HSTS=1 в .env.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 1. сайт-витрина ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── 2. приложение врача ──────────────────────────────────────────────────
    # Одностраничное: любой внутренний адрес отдаём index.html, маршрут разберёт
    # сам фронт. Без этого перезагрузка страницы внутри приложения даст 404.
    location /app/ {
        alias /srv/secondmemory/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # Service worker должен отдаваться без кеша, иначе обновление приложения
    # у врача не появится, пока он не почистит браузер.
    location = /app/sw.js {
        alias /srv/secondmemory/app/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Файлы сборки именуются с хешем — их можно кешировать надолго.
    location ~* ^/app/assets/.*\.(js|css|woff2|ttf|png|svg|webp)$ {
        alias /srv/secondmemory/app/;
        try_files /assets/$1 =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 3. бэкенд ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Без этих трёх строк приложение видит адрес nginx (127.0.0.1) вместо
        # адреса посетителя, и защита от перебора паролей считает всех одним
        # клиентом. В .env при этом должно стоять TRUST_PROXY=1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;       # распознавание речи бывает долгим
        proxy_buffering off;           # чтобы ответы приходили сразу
    }

    # ── 4. админ-панель ──────────────────────────────────────────────────────
    # Токен — не единственная защита: пускаем только со своих адресов.
    location /admin/ {
        # allow 203.0.113.7;           # свой домашний адрес
        # deny all;
        alias /srv/secondmemory/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # прятать версию nginx из ответов
    server_tokens off;
}
